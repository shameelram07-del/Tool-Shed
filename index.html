<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Shed</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tool Shed">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECE4D6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Tool Shed. Phone-first inventory of the tools in the shed.
   Tabs: Shed (pegboard wall) · Tools (search + list) · Care (maintenance) · Lent (who has what).
   Tap a tool for its page; swipe sideways between tools. All content comes from data.json. */
:root{
  --bg:#ECE4D6; --surface:#FFFCF5; --sunk:#E3D9C7; --ink:#1C2326; --body:#3A4246; --muted:#62686A; --line:#D9CDB8;
  --accent:#1F6B57; --accent-ink:#FFFFFF; --hivis:#F4C21B; --hivis-ink:#1C2326; --warn:#B8382F;
  --board:#C8A678; --hole:rgba(58,38,18,.55); --board-edge:#A9875A; --ghost:rgba(58,38,18,.55);
  --shadow:rgba(40,30,20,.35); --glass:rgba(255,252,245,.88);
  --display:"Big Shoulders Display",Impact,sans-serif; --sans:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --surface:#1F2528; --sunk:#192023; --ink:#F2EDE3; --body:#D7D2C8; --muted:#A3A39C; --line:#313A3E;
    --accent:#79C7AE; --accent-ink:#0E2019; --warn:#F08A80;
    --board:#2A3033; --hole:rgba(0,0,0,.7); --board-edge:#20262A; --ghost:rgba(242,237,227,.4);
    --shadow:rgba(0,0,0,.6); --glass:rgba(31,37,40,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --surface:#1F2528; --sunk:#192023; --ink:#F2EDE3; --body:#D7D2C8; --muted:#A3A39C; --line:#313A3E;
  --accent:#79C7AE; --accent-ink:#0E2019; --warn:#F08A80;
  --board:#2A3033; --hole:rgba(0,0,0,.7); --board-edge:#20262A; --ghost:rgba(242,237,227,.4);
  --shadow:rgba(0,0,0,.6); --glass:rgba(31,37,40,.9); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}

/* Header */
.top{padding:calc(14px + env(safe-area-inset-top)) 18px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--hivis);box-shadow:inset 0 0 0 2px var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.view{padding:0 16px;display:flex;flex-direction:column;gap:18px}
.hero{padding:8px 4px 0}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(68px,22vw,112px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
h1.mid{font-size:clamp(54px,17vw,84px)}
.lede{margin:10px 0 0;font-size:17px;color:var(--body);max-width:30ch}
.kicker{font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Tape measure stat strip */
.tape{position:relative;background:var(--hivis);color:var(--hivis-ink);border-radius:14px;padding:14px 16px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden;box-shadow:0 10px 24px -16px var(--shadow)}
.tape::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:
  repeating-linear-gradient(90deg,var(--hivis-ink) 0 2px,transparent 2px 10px) bottom/100% 6px no-repeat,
  repeating-linear-gradient(90deg,var(--hivis-ink) 0 2px,transparent 2px 50px) bottom/100% 12px no-repeat;opacity:.85}
.tape div{display:flex;flex-direction:column;min-width:0}
.tape b{font-family:var(--display);font-weight:900;font-size:clamp(30px,9vw,40px);line-height:.95;font-variant-numeric:tabular-nums}
.tape span{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* Pegboard */
.board{position:relative;border-radius:18px;padding:18px 14px 20px;background-color:var(--board);
  background-image:radial-gradient(circle at center,var(--hole) 0 2.6px,transparent 3.2px);background-size:22px 22px;background-position:3px 3px;
  box-shadow:inset 0 0 0 6px var(--board-edge),0 18px 30px -22px var(--shadow)}
.board .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(92px,auto);grid-auto-flow:dense;gap:12px 10px}
.slot{position:relative;border:0;background:none;padding:14px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
.slot.big{grid-column:span 2;grid-row:span 2}
.slot.wide{grid-column:span 2}
.slot::before{content:"";position:absolute;top:2px;left:50%;width:10px;height:14px;margin-left:-5px;border-radius:2px 2px 6px 6px;background:linear-gradient(#D8DCDF,#8E959A);box-shadow:0 2px 2px rgba(0,0,0,.3)}
.slot .art{width:100%;flex:1;display:grid;place-items:center;transform-origin:50% 0;min-height:0}
.slot .art svg{width:100%;height:auto;max-height:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));overflow:visible}
.slot.big .art svg{max-width:220px}
.slot:active .art{transform:rotate(-3deg) scale(.97);transition:transform .15s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .board .art svg{filter:drop-shadow(0 0 1px rgba(242,237,227,.6)) drop-shadow(0 8px 6px rgba(0,0,0,.5))}}
:root[data-theme="dark"] .board .art svg{filter:drop-shadow(0 0 1px rgba(242,237,227,.6)) drop-shadow(0 8px 6px rgba(0,0,0,.5))}
.board .ghost .art svg{filter:none}
.ghost .art svg *{fill:none!important;stroke:var(--ghost)!important;stroke-width:2.5!important;stroke-dasharray:5 4}
.out{position:absolute;top:22px;right:4px;background:var(--warn);color:#fff;font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .hang .art{animation:hang 1.1s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 60ms)}
  @keyframes hang{0%{transform:translateY(-26px) rotate(-14deg);opacity:0}35%{opacity:1}60%{transform:rotate(6deg)}80%{transform:rotate(-2deg)}100%{transform:none}}
}

/* Dymo label tape */
.dymo{display:inline-block;max-width:100%;background:#17191A;color:#F4F4F0;font-family:var(--mono);font-weight:800;font-size:10px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px 3px;border-radius:2px;
  text-shadow:0 1px 0 rgba(255,255,255,.25),0 -1px 0 rgba(0,0,0,.6);box-shadow:0 1px 2px rgba(0,0,0,.35);transform:rotate(-1deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dymo.y{background:var(--hivis);color:#17191A;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.dymo.lg{font-size:clamp(17px,5.4vw,24px);padding:7px 12px 6px;white-space:normal;letter-spacing:.06em}

/* Cards */
.card{background:var(--surface);border-radius:20px;box-shadow:0 10px 24px -20px var(--shadow)}
.cardpad{padding:16px}
.card h2,.sec h2{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:.95;text-transform:uppercase}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.link{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:inherit}
.arrow{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.duelist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.duelist li{display:flex;gap:10px;align-items:center;font-size:15px}
.mini{width:44px;height:34px;flex:none;display:grid;place-items:center}
.mini svg{width:44px;height:auto;overflow:visible}
.platform{display:flex;gap:12px;align-items:center}
.swatch{width:12px;align-self:stretch;border-radius:6px;flex:none}
.foot{margin:6px 4px 0;font-size:13px;color:var(--muted);text-align:center}

/* Tools list */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:52px}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group h3{margin:4px 4px 8px;font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:4px 0}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;min-height:64px}
.item+.item{border-top:1px solid var(--line)}
.item .thumb{width:58px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.item .thumb svg{width:50px;height:auto;overflow:visible}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .txt b{font-size:16px;line-height:1.2}
.item .txt span{font-size:13px;color:var(--muted)}
.item .val{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--muted);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

/* Care */
.task{display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer}
.task+.task{border-top:1px solid var(--line)}
.task input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.task .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task .tk{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.task .when{font-size:13px;color:var(--muted)}
.task .when.due{color:var(--warn);font-weight:700}
.task.done .tx{text-decoration:line-through;color:var(--muted)}

/* Lent */
.loan{display:flex;align-items:center;gap:12px;padding:12px 14px}
.loan+.loan{border-top:1px solid var(--line)}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer;flex:none}
.btn.ghostbtn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}

/* Tool pages */
.detail{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){.detail.in{animation:rise .42s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}}
.dtop{max-width:560px;width:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pos{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.rail{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.rail::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pin{max-width:560px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.plate{position:relative;border-radius:26px;padding:34px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow:hidden;color:#fff;
  background-image:radial-gradient(circle at center,rgba(0,0,0,.28) 0 2.4px,transparent 3px);background-size:20px 20px}
.plate::before{content:"";position:absolute;top:14px;left:50%;width:14px;height:18px;margin-left:-7px;border-radius:3px 3px 8px 8px;background:linear-gradient(#E5E8EA,#8E959A);box-shadow:0 3px 3px rgba(0,0,0,.35)}
.plate .big{width:min(300px,80%);filter:drop-shadow(0 18px 14px rgba(0,0,0,.35))}
.plate .big svg{width:100%;height:auto;overflow:visible}
.plate .who{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.92;text-align:center}
.status{position:absolute;top:14px;right:14px;font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:4px 8px;background:rgba(255,255,255,.92);color:#17191A}
.status.lent{background:var(--warn);color:#fff}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-size:16px;line-height:1.25}
.fact .v.num{font-family:var(--display);font-weight:900;font-size:34px;line-height:1}
.fact .s{font-size:12px;color:var(--muted)}
.fact.wide{grid-column:span 2}
.kit{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.kit li{background:var(--sunk);border-radius:10px;padding:6px 10px;font-size:15px}
.specs{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.specs dt{font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.specs dd{margin:0}
.note{background:var(--sunk);border-left:6px solid var(--hivis);border-radius:14px;padding:14px 16px;font-size:16px;color:var(--body)}
.lendform{display:flex;gap:8px;margin-top:12px}
.lendform input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px}
.swipehint{text-align:center;font-size:13px;color:var(--muted)}

/* Tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));border-radius:22px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 30px -12px var(--shadow),inset 0 0 0 1px var(--line);padding:6px;z-index:10;display:flex;gap:4px}
.tab{flex:1;min-height:56px;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab .dot{position:absolute;top:7px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px}
@media (max-width:360px){.board .grid{gap:10px 6px}.tape b{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Tool Shed</div>
    <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark"></button>
  </header>
  <main id="main" class="view" aria-live="polite"><p class="empty">Opening the shed…</p></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-label="Tool">
  <div class="dtop">
    <button class="iconbtn" id="closeBtn" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="pos" id="pos"></span>
    <span style="width:44px"></span>
  </div>
  <div class="rail" id="rail"></div>
</div>
<script>
'use strict';
/* ---------- Drawings: original flat SVGs, viewBox 0 0 160 120. c = brand colour ---------- */
const D='#2A2E30', M='#C9CDD0', G='#8E959A';
const ART={
  mitresaw:c=>`<rect x="14" y="94" width="132" height="12" rx="3" fill="${D}"/><ellipse cx="78" cy="94" rx="42" ry="6" fill="${G}"/><rect x="34" y="82" width="88" height="8" rx="2" fill="${M}"/><rect x="112" y="40" width="10" height="56" rx="3" fill="${D}"/><rect x="42" y="30" width="80" height="5" rx="2.5" fill="${M}"/><rect x="42" y="39" width="80" height="5" rx="2.5" fill="${M}"/><circle cx="64" cy="64" r="25" fill="#E2E5E7" stroke="${D}" stroke-width="3"/><circle cx="64" cy="64" r="17" fill="none" stroke="${G}" stroke-width="2" stroke-dasharray="3 3"/><path d="M38 64a26 26 0 0 1 52 0z" fill="${c}"/><rect x="74" y="24" width="32" height="24" rx="7" fill="${c}"/><rect x="80" y="30" width="20" height="4" rx="2" fill="${D}" opacity=".5"/><path d="M42 44q-10-20 10-25h14v9H54q-6 3-3 13z" fill="${D}"/><circle cx="64" cy="64" r="4" fill="${D}"/>`,
  sander:c=>`<ellipse cx="74" cy="98" rx="48" ry="9" fill="${D}"/><path d="M30 96q0-42 44-48q44 6 44 48z" fill="${c}"/><path d="M52 56q22-28 44 0q-22 9-44 0z" fill="${D}"/><rect x="64" y="72" width="20" height="7" rx="3.5" fill="#F2F2EE"/><rect x="114" y="74" width="22" height="14" rx="7" fill="#5A6064"/><path d="M132 64q20-2 18 20q-2 18-18 12z" fill="${G}"/><path d="M36 92h76" stroke="${D}" stroke-width="2" opacity=".35"/>`,
  vac:c=>`<rect x="34" y="46" width="74" height="56" rx="12" fill="${c}"/><rect x="28" y="34" width="86" height="18" rx="7" fill="${D}"/><rect x="58" y="22" width="26" height="12" rx="6" fill="none" stroke="${D}" stroke-width="6"/><rect x="48" y="62" width="46" height="7" rx="3.5" fill="#FFFFFF" opacity=".35"/><rect x="46" y="76" width="18" height="10" rx="2" fill="${D}" opacity=".7"/><circle cx="46" cy="106" r="7" fill="${D}"/><circle cx="96" cy="106" r="7" fill="${D}"/><path d="M110 58q34 0 30 30q-2 16 12 18" fill="none" stroke="#5A6064" stroke-width="8" stroke-linecap="round"/>`,
  blower:c=>`<path d="M8 56h88v12H12q-4 0-4-4z" fill="${D}"/><path d="M92 44h34q14 0 14 15v8q0 15-14 15H92z" fill="${c}"/><path d="M102 46q10-22 28 0" fill="none" stroke="${D}" stroke-width="7" stroke-linecap="round"/><rect x="106" y="82" width="28" height="20" rx="3" fill="${D}"/><rect x="110" y="86" width="20" height="4" rx="2" fill="${c}"/><path d="M56 68q-8 38 30 36q8-16 6-36z" fill="#7F826C"/><circle cx="118" cy="62" r="5" fill="${D}" opacity=".5"/>`,

let data=null, loans=store.get('ts-loans',{}), careDone=store.get('ts-care',{}), filter={q:'',cat:'all'}, firstShed=true;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?null:'$'+(Math.round(n*100)%100?n.toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(n).toLocaleString('en-NZ'));
const today=()=>new Date().toISOString().slice(0,10);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const niceDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'});
const label=t=>[t.brand,t.name].filter(Boolean).join(' ');
const tools=()=>data.tools;
const byId=id=>tools().find(t=>t.id===id);
const loanOf=t=>loans[t.id]||(t.lentTo?{to:t.lentTo,on:t.lentOn||null,repo:true}:null);
function careList(){
  const out=[];
  for(const t of tools()) for(const c of (t.care||[])){
    const key=t.id+':'+c.id, last=careDone[key]||null;
    // Never ticked: counts from careStart (when the shed went online), unless the job is flagged as needed now.
    const from=last||(c.now?null:data.careStart||null);
    const left=from?c.every-days(from,today()):0;
    out.push({t,c,key,last,left,due:left<=0});
  }
  return out.sort((a,b)=>a.left-b.left);
}

  railIds=ts.map(t=>t.id);
  const det=$('#detail'), rail=$('#rail');
  rail.innerHTML=ts.map((t,k)=>toolPage(t,k,ts.length)).join('');
  const wasHidden=det.hidden;
  det.hidden=false; document.body.classList.add('locked');
  if(wasHidden){det.classList.remove('in');void det.offsetWidth;det.classList.add('in')}
  rail.scrollLeft=i*rail.clientWidth;
  $('#pos').textContent=`${i+1} / ${ts.length}`;
  if(push) history.pushState({tool:id},'','#tool/'+id);
}
function closeTool(){ $('#detail').hidden=true; document.body.classList.remove('locked'); }
let railTimer;
$('#rail').addEventListener('scroll',e=>{
  clearTimeout(railTimer);
  railTimer=setTimeout(()=>{const r=e.target,i=Math.round(r.scrollLeft/r.clientWidth),id=railIds[i];if(!id)return;$('#pos').textContent=`${i+1} / ${railIds.length}`;history.replaceState({tool:id},'','#tool/'+id)},90);
},{passive:true});
$('#closeBtn').addEventListener('click',()=>{ if(history.state&&history.state.tool&&lastTab) history.back(); else location.hash=lastTab||'shed'; });

/* ---------- Router + events ---------- */
let lastTab='shed';
function render(){
  if(!data) return;
  const h=location.hash.slice(1);
  if(h.startsWith('tool/')){ const id=h.slice(5); if(byId(id)){ if($('#detail').hidden||!railIds.includes(id)) openTool(id,false); renderTab(lastTab); return; } }
  closeTool();
  renderTab(['shed','tools','care','lent'].includes(h)?h:'shed');
}
function renderTab(v){
  const changed=v!==lastTab; lastTab=v;
  $('#main').innerHTML={shed:viewShed,tools:viewTools,care:viewCare,lent:viewLent}[v]();
  tabs(v);
  if(changed) window.scrollTo(0,0);
}
function refresh(){ // re-render after a change, keeping scroll positions
  const y=window.scrollY; renderTab(lastTab); window.scrollTo(0,y);
  if(!$('#detail').hidden){ const r=$('#rail'), x=r.scrollLeft, ys=[...r.children].map(p=>p.scrollTop); const id=railIds[Math.round(x/r.clientWidth)]; openTool(id,false); r.scrollLeft=x; [...r.children].forEach((p,k)=>p.scrollTop=ys[k]||0); }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tool]'); if(t){ e.preventDefault(); openTool(t.dataset.tool); return; }
  const c=e.target.closest('[data-cat]'); if(c){ filter.cat=c.dataset.cat; renderTab('tools'); return; }
  const b=e.target.closest('[data-back]'); if(b){ delete loans[b.dataset.back]; store.set('ts-loans',loans); refresh(); }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.care; if(!k) return;
  if(e.target.checked) careDone[k]=today(); else delete careDone[k];
  store.set('ts-care',careDone); setTimeout(refresh,250);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-lend]'); if(!f) return; e.preventDefault();
  const who=f.who.value.trim(); if(!who) return;
  loans[f.dataset.lend]={to:who,on:today()}; store.set('ts-loans',loans); refresh();
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q') return; filter.q=e.target.value;
  const pos=e.target.selectionStart; renderTab('tools'); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos);
});
window.addEventListener('hashchange',render);
window.addEventListener('popstate',render);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#detail').hidden) $('#closeBtn').click(); });

/* ---------- Theme ---------- */
const THEMES=['auto','light','dark'];
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>';
const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const AUTO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>';
function applyTheme(t){ if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); $('#themeBtn').innerHTML={auto:AUTO,light:SUN,dark:MOON}[t]; $('#themeBtn').setAttribute('aria-label','Theme: '+t+'. Tap to change'); }
let theme=store.get('ts-theme','auto'); applyTheme(theme);
$('#themeBtn').addEventListener('click',()=>{ theme=THEMES[(THEMES.indexOf(theme)+1)%3]; store.set('ts-theme',theme); applyTheme(theme); });

/* ---------- Load ---------- */
fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{ data=d; render(); })
  .catch(()=>{ $('#main').innerHTML='<p class="empty card">Couldn\'t open the shed. Check your connection and pull to refresh.</p>'; });
</script>
</body>
</html>
