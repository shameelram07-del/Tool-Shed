<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Shed</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tool Shed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121516">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Serif:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Tool Shed. Phone-first inventory of the tools in the shed. 60/30/10: graphite / sawdust cream / hi-vis yellow.
   Tool-themed parts: spirit-level scroll indicator, saw blade hero, tape-measure stats, pegboard wall, saw-tooth slide-up reel with a ruler,
   lineup shelf, caution tape, torque-gauge bargain meter, blueprint spec cards, hex-nut tick boxes, label-tape names.
   Shed tab: hero → bench → wall → reel (one featured tool per step) → lineup → statement → gauge.
   Power / Hand / Yard: artwork hero, picker, swipe sideways through tool pages. Care and Lent tabs. All content from data.json. */
:root{
  --bg:#EFE6D4; --surface:#FBF6EC; --sunk:#E4D9C3; --ink:#16191B; --body:#3B4043; --muted:#64665F; --line:#D6C9AF;
  --hv:#F4C21B; --hv-ink:#16191B; --warn:#B3362D; --ok:#2F7A4F;
  --night:#121516; --cream:#EFE6D4; --wood:#8A5A2B; --blue:#1D4C86;
  --board:#C8A678; --hole:rgba(58,38,18,.55); --board-edge:#A9875A; --ghost:rgba(58,38,18,.6);
  --shadow:rgba(40,30,20,.35); --glass:rgba(251,246,236,.86);
  --display:"Big Shoulders Display",Impact,sans-serif; --serif:"Instrument Serif",Georgia,serif; --sans:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121516; --surface:#1C2124; --sunk:#171B1D; --ink:#EFE6D4; --body:#D2CABB; --muted:#9E9A90; --line:#2C3336; --warn:#F08A80; --ok:#7FD0A0;
    --board:#262B2E; --hole:rgba(0,0,0,.75); --board-edge:#1B1F22; --ghost:rgba(239,230,212,.45);
    --shadow:rgba(0,0,0,.6); --glass:rgba(28,33,36,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121516; --surface:#1C2124; --sunk:#171B1D; --ink:#EFE6D4; --body:#D2CABB; --muted:#9E9A90; --line:#2C3336; --warn:#F08A80; --ok:#7FD0A0;
  --board:#262B2E; --hole:rgba(0,0,0,.75); --board-edge:#1B1F22; --ghost:rgba(239,230,212,.45);
  --shadow:rgba(0,0,0,.6); --glass:rgba(28,33,36,.86); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hv);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
main{overflow-x:clip}
.kicker{font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}

/* Header: transparent over the hero, glass after. The spirit level's bubble shows how far down the page you are. */
.top{position:sticky;top:0;z-index:12;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .3s,box-shadow .3s,color .3s}
.top.glassy{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
body.dark-top .top:not(.glassy){color:var(--cream)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--hv);box-shadow:inset 0 0 0 2px currentColor}
.level{flex:none;width:86px;height:22px;border-radius:6px;background:var(--hv);box-shadow:inset 0 0 0 2px #16191B,0 2px 6px rgba(0,0,0,.25);display:grid;place-items:center}
.vial{position:relative;width:60px;height:12px;border-radius:6px;background:#B9E36A;box-shadow:inset 0 0 0 1.5px #16191B;overflow:hidden}
.vial::before,.vial::after{content:"";position:absolute;top:0;bottom:0;width:1.5px;background:#16191B;left:22px}
.vial::after{left:auto;right:22px}
.vial i{position:absolute;left:50%;top:50%;width:12px;height:8px;margin:-4px 0 0 -6px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(22,25,27,.35);will-change:transform}
.acts{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 6%,transparent);display:grid;place-items:center;cursor:pointer;color:inherit;transition:transform .2s var(--ease)}
.iconbtn:active{transform:scale(.9) rotate(-8deg)}
@media (max-width:370px){.level{width:66px}.vial{width:44px}.vial::before{left:15px}.vial::after{right:15px}}

/* Loader */
.loader{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.loader svg{width:72px;height:72px;animation:spin 1.2s linear infinite}

/* Hero: stippled night, a saw blade that turns as you scroll, hi-vis glow, mist at the bottom */
.hero{position:relative;height:150svh;margin-top:calc(-64px - env(safe-area-inset-top))}
.hstage{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--night);color:var(--cream);display:flex;flex-direction:column;justify-content:center;padding:0 22px}
.stipple{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(239,230,212,.16) 0 1.6px,transparent 2.2px);background-size:18px 18px;opacity:.9}
.hglow{position:absolute;left:-10%;right:-50%;top:22%;height:70%;background:radial-gradient(45% 42% at 62% 55%,rgba(244,194,27,.36),rgba(244,194,27,.07) 55%,transparent 72%);pointer-events:none}
.blade{position:absolute;right:-42%;top:50%;width:min(118vw,620px);margin-top:calc(min(118vw,620px) / -2.6);pointer-events:none;will-change:transform;filter:drop-shadow(0 0 30px rgba(244,194,27,.16))}
.blade svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:no-preference){.blade svg{animation:spin 60s linear infinite}}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:#F4D46A;opacity:0}
@media (prefers-reduced-motion:no-preference){.motes i{animation:mote 9s linear infinite}@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(-50px,-60vh);opacity:0}}}
.mist{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg) 70%,transparent) 60%,var(--bg));pointer-events:none}
.hcopy{position:relative;z-index:1;transform-origin:30% 40%;will-change:transform,opacity}
.hero h1{margin:10px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(108px,36vw,190px);line-height:.8;letter-spacing:-.01em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.hero h1 .acc{color:var(--hv)}
.hsub{margin:16px 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(24px,7vw,32px);line-height:1.1;max-width:12em;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.hstats{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 13px;border-radius:999px;background:rgba(18,21,22,.55);border:1px solid rgba(239,230,212,.22);font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill b{color:var(--hv);font-variant-numeric:tabular-nums}
.hscroll{position:absolute;left:0;right:0;bottom:calc(15% + env(safe-area-inset-bottom));z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:.75}
.hscroll i{width:2px;height:28px;background:linear-gradient(currentColor,transparent);border-radius:2px}
@media (prefers-reduced-motion:no-preference){.hscroll i{animation:drip 1.8s var(--ease) infinite}@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}}

/* Animated titles: words rise out of a mask, the accent word blurs in, a hi-vis swash draws under */
.tt .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.04em}
.tt .w>span{display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .tt .w>span{transform:translateY(110%) rotate(4deg);transform-origin:0 100%;animation:up .95s var(--ease) forwards;animation-delay:calc(var(--k) * 90ms + 80ms)}
  .tt .acc .w>span{filter:blur(8px);animation-name:upblur}
  .sub{opacity:0;animation:fade .8s var(--ease) .5s forwards}
}
@keyframes up{to{transform:none}}
@keyframes upblur{60%{filter:blur(1px)}to{transform:none;filter:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.swash{display:block;height:6px;width:min(200px,50%);margin-top:8px;border-radius:6px;background:var(--hv);transform-origin:left}
@media (prefers-reduced-motion:no-preference){.swash{transform:scaleX(0);animation:grow .9s var(--ease) .55s forwards}@keyframes grow{to{transform:scaleX(1)}}}

/* Reveal on scroll */
@media (prefers-reduced-motion:no-preference){.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}.rv.in{opacity:1;transform:none}}

.flow{padding:0 16px;display:flex;flex-direction:column;gap:20px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:14px 4px -6px}
.sechead h2{margin:0;font-family:var(--display);font-weight:900;font-size:44px;line-height:.85;text-transform:uppercase}
.sechead h2 .serif{text-transform:none;font-size:.82em;color:var(--muted)}

/* On the bench */
.needs{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.needs::-webkit-scrollbar{display:none}
.need{position:relative;flex:0 0 78%;scroll-snap-align:start;border:0;text-align:left;cursor:pointer;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:0 10px 24px -20px var(--shadow);min-height:150px;color:inherit}
.need .nt{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px}
.lvl{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 8px;background:var(--warn);color:#fff}
.lvl.care{background:var(--hv);color:var(--hv-ink)}
.lvl.calm{background:var(--ok);color:#fff}
.need h3{margin:0;font-family:var(--display);font-weight:900;font-size:28px;line-height:.95;text-transform:uppercase}
.need p{margin:0;color:var(--body);font-size:15px}
.need .mini{margin-left:auto}
/* screw heads in the corners of cards; they turn as the card arrives */
.screws::before,.screws::after{content:"";position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background-image:linear-gradient(transparent 42%,#3a3f42 42% 58%,transparent 58%),radial-gradient(circle at 35% 30%,#f2f2f2,#9aa0a4 60%,#5a6064);box-shadow:0 1px 1px rgba(0,0,0,.4);transition:transform 1.2s var(--ease)}
.screws::before{left:10px}.screws::after{right:10px}
@media (prefers-reduced-motion:no-preference){.rv.screws:not(.in)::before{transform:rotate(-300deg)}.rv.screws:not(.in)::after{transform:rotate(300deg)}}

/* Tape measure strip: the blade pulls out of the case */
.tapewrap{display:flex;align-items:stretch;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.tcase{flex:none;width:58px;border-radius:14px;background:var(--night);display:grid;place-items:center;position:relative;z-index:1;box-shadow:inset 0 0 0 2px rgba(239,230,212,.12)}
.tcase i{width:30px;height:30px;border-radius:50%;background:var(--hv);box-shadow:inset 0 0 0 5px var(--night),inset 0 0 0 7px var(--hv)}
.tape{flex:1;position:relative;background:var(--hv);color:var(--hv-ink);border-radius:0 6px 6px 0;margin-left:-8px;padding:12px 14px 22px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden}
.tape::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,var(--hv-ink) 0 2px,transparent 2px 10px) bottom/100% 6px no-repeat,repeating-linear-gradient(90deg,var(--hv-ink) 0 2px,transparent 2px 50px) bottom/100% 12px no-repeat;opacity:.85}
.tape::before{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:#8E959A}
.tape div{display:flex;flex-direction:column;min-width:0}
.tape b{font-family:var(--display);font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:.95;font-variant-numeric:tabular-nums}
.tape span{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.tapewrap .tape{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s var(--ease) .15s}.tapewrap.in .tape{clip-path:inset(0 0 0 0)}}

/* Pegboard */
.board{position:relative;border-radius:18px;padding:18px 14px 20px;background-color:var(--board);background-image:radial-gradient(circle at center,var(--hole) 0 2.6px,transparent 3.2px);background-size:22px 22px;background-position:3px 3px;box-shadow:inset 0 0 0 6px var(--board-edge),0 18px 30px -22px var(--shadow)}
.board .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(92px,auto);grid-auto-flow:dense;gap:12px 10px}
.slot{position:relative;border:0;background:none;padding:14px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent;color:inherit}
.slot.big{grid-column:span 2;grid-row:span 2}
.slot.wide{grid-column:span 2}
.slot::before{content:"";position:absolute;top:2px;left:50%;width:10px;height:14px;margin-left:-5px;border-radius:2px 2px 6px 6px;background:linear-gradient(#D8DCDF,#8E959A);box-shadow:0 2px 2px rgba(0,0,0,.3)}
.slot .art{width:100%;flex:1;display:grid;place-items:center;transform-origin:50% 0;min-height:0}
.slot .art svg{width:100%;height:auto;max-height:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));overflow:visible}
.slot.big .art svg{max-width:220px}
.slot:active .art{transform:rotate(-5deg) scale(.96);transition:transform .15s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .board .art svg{filter:drop-shadow(0 0 1px rgba(239,230,212,.6)) drop-shadow(0 8px 6px rgba(0,0,0,.5))}}
:root[data-theme="dark"] .board .art svg{filter:drop-shadow(0 0 1px rgba(239,230,212,.6)) drop-shadow(0 8px 6px rgba(0,0,0,.5))}
.board .ghost .art svg{filter:none}
.ghost .art svg *{fill:none!important;stroke:var(--ghost)!important;stroke-width:2.5!important;stroke-dasharray:5 4;animation:none!important}
.out{position:absolute;top:22px;right:4px;background:var(--warn);color:#fff;font-family:var(--mono);font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .board .slot .art{opacity:0}
  .board.in .slot .art{animation:hang 1.1s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
  @keyframes hang{0%{transform:translateY(-26px) rotate(-14deg);opacity:0}35%{opacity:1}60%{transform:rotate(6deg)}80%{transform:rotate(-2deg)}100%{transform:none;opacity:1}}
}

/* Label tape */
.dymo{display:inline-block;max-width:100%;background:#17191A;color:#F4F4F0;font-family:var(--mono);font-weight:800;font-size:10px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px 3px;border-radius:2px;text-shadow:0 1px 0 rgba(255,255,255,.25),0 -1px 0 rgba(0,0,0,.6);box-shadow:0 1px 2px rgba(0,0,0,.35);transform:rotate(-1deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dymo.lg{font-size:clamp(15px,4.6vw,20px);padding:7px 12px 6px;white-space:normal;letter-spacing:.06em}

/* Reel: each featured tool is a full-screen panel in its brand colour. The next one slides up over the last with a saw-tooth edge. */
.reel{position:relative;margin:10px 0 0}
.rstage{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--night);color:var(--cream)}
.panel{position:absolute;inset:0;background:var(--c);will-change:transform}
.panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.22) 0 1.8px,transparent 2.4px);background-size:20px 20px}
.panel::after{content:"";position:absolute;left:-20%;right:-20%;top:20%;height:60%;background:radial-gradient(45% 45% at 50% 50%,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.teeth{position:absolute;left:0;right:0;top:-17px;height:18px;background:linear-gradient(135deg,transparent 50%,var(--c) 50.5%) 0 0/24px 18px repeat-x,linear-gradient(225deg,transparent 50%,var(--c) 50.5%) 0 0/24px 18px repeat-x}
.rhead{position:absolute;left:20px;right:44px;top:calc(76px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:baseline;z-index:3}
.rnum{font-family:var(--display);font-weight:900;font-size:64px;line-height:.8}
.rnum small{font-size:22px;opacity:.6}
.rcat{font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.rword{position:absolute;left:0;right:0;top:41%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-weight:900;line-height:.8;text-transform:uppercase;color:var(--cream);white-space:nowrap;z-index:1;will-change:transform}
.rart{position:absolute;left:50%;top:47%;width:min(74vw,380px);margin-left:calc(min(74vw,380px) / -2);transform:translateY(-50%);z-index:2;will-change:transform;filter:drop-shadow(0 26px 20px rgba(0,0,0,.4))}
.rart svg{width:100%;height:auto;overflow:visible}
.rinfo{position:absolute;left:20px;right:44px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.rname{font-family:var(--serif);font-style:italic;font-size:clamp(26px,7.6vw,36px);line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.rrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rbtn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--cream);color:#16191B;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease)}
.rbtn:active{transform:scale(.94)}
.rpill{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.28);font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
/* Ruler down the side: the pointer shows how far through the favourites you are */
.ruler{position:absolute;right:8px;top:50%;width:18px;height:min(46svh,320px);transform:translateY(-50%);z-index:60;border-radius:4px;background-color:var(--hv);box-shadow:inset 0 0 0 1.5px #16191B,0 6px 14px rgba(0,0,0,.35);background-image:repeating-linear-gradient(to bottom,#16191B 0 1.5px,transparent 1.5px 8px);background-size:7px 100%;background-repeat:no-repeat;background-position:right 2px top}
.ruler b{position:absolute;right:20px;top:0;margin-top:-9px;width:0;height:0;border:9px solid transparent;border-left-color:var(--cream);border-right-width:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));will-change:transform}

/* Lineup: every tool on one long shelf that slides sideways as you scroll down */
.lineup{position:relative}
.lstage{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lhead{padding:0 20px}
.lhead h2{margin:4px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(64px,20vw,104px);line-height:.82;text-transform:uppercase}
.lhead h2 .serif{text-transform:none;color:var(--muted);font-size:.86em}
.ltrack{display:flex;align-items:flex-end;gap:18px;padding:0 24px;width:max-content;will-change:transform}
.lu{flex:none;width:150px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:inherit}
.lu svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25));transition:transform .3s var(--ease)}
.lu:active svg{transform:translateY(-8px) rotate(-4deg)}
.lu .dymo{margin-top:22px}
.shelf{height:14px;margin-top:-52px;background:linear-gradient(#A8713A,var(--wood));box-shadow:0 10px 14px -6px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.2)}
.lfoot{padding:50px 20px 0;display:flex;justify-content:space-between;font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Caution tape */
.ctape{margin:26px -16px;width:calc(100% + 32px);transform:rotate(-2.5deg);background:var(--hv);color:#16191B;overflow:hidden;border-top:8px solid;border-bottom:8px solid;border-image:repeating-linear-gradient(-45deg,#16191B 0 12px,#F4C21B 12px 24px) 8;box-shadow:0 12px 20px -10px rgba(0,0,0,.4)}
.ctape div{display:flex;width:max-content;font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase;padding:9px 0;white-space:nowrap}
.ctape span{padding-right:26px}
@media (prefers-reduced-motion:no-preference){.ctape div{animation:marq 26s linear infinite}@keyframes marq{to{transform:translateX(-50%)}}}

/* Statement: lights word by word */
.say{padding:34px 8px 20px}
.say p{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(62px,19vw,104px);line-height:.86;text-transform:uppercase}
.say p .serif{text-transform:none;font-size:.92em;display:block}
.say .wd{opacity:.14;transition:opacity .35s,color .35s}
.say .wd.lit{opacity:1}
.say .wd.lit.hv{color:var(--hv);-webkit-text-stroke:1px var(--ink)}
.say p.sub2{margin:18px 0 0;color:var(--body);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.45;text-transform:none;max-width:30ch}

/* Cards */
.card{background:var(--surface);border-radius:22px;box-shadow:0 10px 24px -20px var(--shadow)}
.cardpad{padding:16px}
.card h2{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:.95;text-transform:uppercase}
.mini{width:46px;height:36px;flex:none;display:grid;place-items:center}
.mini svg{width:46px;height:auto;overflow:visible}
.platform{display:flex;gap:12px;align-items:center}
.swatch{width:12px;align-self:stretch;border-radius:6px;flex:none}
.foot{margin:6px 4px 0;font-size:13px;color:var(--muted);text-align:center}

/* Torque gauge (bargain meter): always night, the hi-vis arc glows */
.gauge{position:relative;background:var(--night);color:var(--cream);border-radius:26px;padding:20px 18px 20px;overflow:hidden;text-align:center;box-shadow:inset 0 0 0 1px rgba(239,230,212,.1)}
.gauge::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 70%,rgba(244,194,27,.3),transparent 70%)}
.gauge>*{position:relative}
.gauge svg{width:min(320px,92%);height:auto;overflow:visible;display:block;margin:10px auto 0}
.gauge .garc{fill:none;stroke:var(--hv);stroke-width:14;stroke-linecap:round;stroke-dasharray:251.4;stroke-dashoffset:251.4;filter:drop-shadow(0 0 10px rgba(244,194,27,.8));transition:stroke-dashoffset 1.8s var(--ease) .2s}
.gauge .gneedle{transform-box:view-box;transform-origin:100px 100px;transform:rotate(-90deg);transition:transform 1.8s cubic-bezier(.3,1.4,.5,1) .2s}
.gauge.in .garc{stroke-dashoffset:var(--off)}
.gauge.in .gneedle{transform:rotate(var(--deg))}
.gauge .gbig{margin:10px 0 0;font-family:var(--display);font-weight:900;font-size:84px;line-height:.8}
.gauge .gbig small{font-size:.45em}
.gauge .gline{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.1}
.gauge .gnote{margin:8px auto 0;font-size:14px;color:rgba(239,230,212,.7);max-width:30ch}

/* Tab heroes with artwork */
.chero{position:relative;margin:0 0 4px;border-radius:30px;overflow:hidden;background:var(--night);color:var(--cream);padding:150px 20px 22px;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 0 0 0 1px rgba(239,230,212,.08)}
.chero .stipple{opacity:.7}
.chero .cglow{position:absolute;right:-30%;top:-20%;width:110%;height:110%;background:radial-gradient(40% 40% at 60% 45%,rgba(244,194,27,.34),transparent 70%)}
.chero .emb{position:absolute;right:-4%;top:-2%;width:58%;filter:drop-shadow(0 18px 16px rgba(0,0,0,.5));transform-origin:70% 30%}
.chero .emb svg{width:100%;height:auto;overflow:visible}
@media (prefers-reduced-motion:no-preference){.chero .emb{animation:embin 1.2s cubic-bezier(.3,1.4,.5,1) both}@keyframes embin{from{transform:translate(30%,-10%) rotate(24deg) scale(.7);opacity:0}to{transform:none;opacity:1}}}
.chero>.kicker,.chero h1,.chero p,.chero .swash{position:relative;z-index:1}
.chero .kicker{color:rgba(239,230,212,.72)}
.chero h1{margin:4px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(76px,24vw,128px);line-height:.8;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.chero h1 .acc{color:var(--hv)}
.chero h1.long{font-size:clamp(62px,19.5vw,104px)}
.chero p{margin:12px 0 0;font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.1;max-width:13em;text-shadow:0 2px 12px rgba(0,0,0,.7)}

/* Category: picker + swipeable tool pages */
.picker{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:6px 16px 6px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pk{flex:none;width:86px;border:0;border-radius:16px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:var(--surface);font-size:12px;font-weight:700;line-height:1.1;text-align:center;transition:transform .25s var(--ease),background .25s;color:inherit}
.pk svg{width:56px;height:auto;overflow:visible}
.pk[aria-current="true"]{background:var(--hv);color:var(--hv-ink);transform:translateY(-3px) rotate(-2deg)}
.posrow{display:flex;justify-content:space-between;align-items:center;margin:0 4px}
.pos{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .3s,background .3s}
.dots i.on{width:22px;border-radius:4px;background:var(--ink)}
.rail{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;margin:0 -16px}
.rail::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.plate{position:relative;border-radius:200px 200px 28px 28px;padding:44px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:hidden;color:var(--cream);background-image:radial-gradient(circle at center,rgba(0,0,0,.25) 0 2.2px,transparent 2.8px);background-size:20px 20px}
.plate .verb{position:absolute;left:0;right:0;top:20%;text-align:center;font-family:var(--display);font-weight:900;line-height:.8;text-transform:uppercase;color:rgba(239,230,212,.95);white-space:nowrap;pointer-events:none}
.plate .big{position:relative;z-index:1;width:min(300px,84%);margin-top:34px;filter:drop-shadow(0 18px 14px rgba(0,0,0,.4))}
.plate .big svg{width:100%;height:auto;overflow:visible}
.plate .dymo{position:relative;z-index:2}
.plate .who{position:relative;z-index:2;font-family:var(--mono);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.92;text-align:center}
.status{position:absolute;z-index:2;top:16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:4px 8px;background:rgba(255,255,255,.92);color:#17191A;white-space:nowrap}
.status.lent{background:var(--warn);color:#fff}
/* the plate opens up when its page arrives */
@media (prefers-reduced-motion:no-preference){
  .page .plate{clip-path:inset(16% 20% 26% 20% round 200px 200px 28px 28px);transition:clip-path .9s var(--ease)}
  .page.cur .plate{clip-path:inset(0 0 0 0 round 200px 200px 28px 28px)}
  .page .plate .big{transform:scale(.6) rotate(-14deg);transition:transform 1s cubic-bezier(.3,1.5,.5,1) .1s}
  .page.cur .plate .big{transform:none}
  .page .plate .verb{transform:translateY(40%);opacity:0;transition:transform .9s var(--ease) .15s,opacity .6s .15s}
  .page.cur .plate .verb{transform:none;opacity:1}
  .page .facts .fact{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--n) * 70ms + 250ms)}
  .page.cur .facts .fact{opacity:1;transform:none}
}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-size:16px;line-height:1.25}
.fact .v.num{font-family:var(--display);font-weight:900;font-size:36px;line-height:1}
.fact .s{font-size:12px;color:var(--muted)}
.fact.wide{grid-column:span 2}
.fact.hvf{background:var(--hv);color:var(--hv-ink)}
.fact.hvf .k{color:var(--hv-ink);opacity:.8}
/* price facts are swing tags */
.fact.tag{position:relative;border-radius:8px 18px 18px 8px;padding-left:28px}
.fact.tag::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--muted)}
.uses{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.uses li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.uses li::before{content:"";width:10px;height:10px;margin-top:6px;border-radius:2px;background:var(--hv);flex:none;box-shadow:inset 0 0 0 2px var(--ink)}
.kit{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.kit li{background:var(--sunk);border-radius:10px;padding:6px 10px;font-size:15px}
.note{background:var(--sunk);border-left:6px solid var(--hv);border-radius:14px;padding:14px 16px;font-size:16px;color:var(--body)}
/* Blueprint spec card: the drawing redraws itself as a white outline */
.bp{position:relative;border-radius:22px;padding:16px;color:#EAF2FF;background-color:var(--blue);background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px,60px 60px,12px 12px,12px 12px;overflow:hidden}
.bp h2{margin:0;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.bp .bpart{width:min(240px,74%);margin:8px auto 2px}
.bp .bpart svg{width:100%;height:auto;overflow:visible}
.bp .bpart svg *{fill:none!important;stroke:#EAF2FF!important;stroke-width:1.6!important;animation:none!important}
.bp .dim{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;justify-content:center;opacity:.9}
.bp .dim::before,.bp .dim::after{content:"";flex:1;height:1px;background:#EAF2FF;max-width:70px}
.bp dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-family:var(--mono);font-size:13px}
.bp dt{font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.bp dd{margin:0;font-weight:600}
@media (prefers-reduced-motion:no-preference){.bp .bpart svg *{stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 2.4s ease .3s}.page.cur .bp .bpart svg *{stroke-dashoffset:0}}
.pairs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.pair{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:8px 14px 8px 8px;background:var(--sunk);cursor:pointer;font-weight:700;font-size:15px;text-align:left;color:inherit}
.lendform{display:flex;gap:8px;margin-top:12px}
.lendform input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer;flex:none;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.94)}
.btn.hvb{background:var(--hv);color:var(--hv-ink)}
.swipehint{text-align:center;font-size:13px;color:var(--muted);margin:0}

/* Care + Lent. Tick boxes are hex nuts that turn when you tick them. */
.task{display:flex;align-items:flex-start;gap:12px;padding:14px;cursor:pointer}
.task+.task{border-top:1px solid var(--line)}
.task input{appearance:none;-webkit-appearance:none;width:30px;height:30px;margin:0;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--muted);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);transition:transform .6s cubic-bezier(.3,1.5,.5,1),background .3s}
.task input::after{content:"";width:13px;height:13px;border-radius:50%;background:var(--surface);transition:all .3s}
.task input:checked{background:var(--hv);transform:rotate(180deg)}
.task input:checked::after{width:7px;height:7px;background:var(--hv-ink)}
.task:focus-within{outline:3px solid var(--hv);outline-offset:-3px;border-radius:14px}
.task .tt2{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task .tk{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.task .when{font-size:13px;color:var(--muted)}
.task .when.due{color:var(--warn);font-weight:700}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.loan{display:flex;align-items:center;gap:12px;padding:12px 14px}
.loan+.loan{border-top:1px solid var(--line)}
.items{list-style:none;margin:0;padding:4px 0}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;min-height:64px;color:inherit}
.items li+li .item{border-top:1px solid var(--line)}
.item .thumb{width:58px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.item .thumb svg{width:50px;height:auto;overflow:visible}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item .txt b{font-size:16px;line-height:1.2}
.item .txt span{font-size:13px;color:var(--muted)}
.item .val{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--muted);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);margin:0}
.h2s{margin:0 4px 10px;font-family:var(--display);font-weight:900;font-size:32px;line-height:.95;text-transform:uppercase}

/* Search sheet */
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:fade .35s var(--ease)}}
.sheet .shead{max-width:560px;width:100%;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:52px}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
.sheet .sbody{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:4px 16px 40px}

/* Tab bar: the selected tab is a strip of hi-vis tape */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(460px,calc(100% - 20px));border-radius:24px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 30px -12px var(--shadow),inset 0 0 0 1px var(--line);padding:6px;z-index:70;display:flex;gap:2px}
.tab{flex:1;min-width:0;min-height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;position:relative;transition:background .25s,color .25s,transform .25s var(--ease)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:var(--hv);color:var(--hv-ink);transform:translateY(-4px) rotate(-2deg);box-shadow:0 8px 14px -8px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.tab[aria-current="page"] svg{animation:wig .6s var(--ease)}@keyframes wig{0%{transform:rotate(0)}30%{transform:rotate(-18deg) scale(1.15)}60%{transform:rotate(10deg)}100%{transform:none}}}
.tab .dot{position:absolute;top:3px;right:calc(50% - 24px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px}

/* Drawing motion: only where the drawing is the star (.live) */
svg [class^="a-"]{transform-box:view-box}
@media (prefers-reduced-motion:no-preference){
  .live .a-spin{animation:spin 1.4s linear infinite}
  .live .a-chop{animation:chop 3.2s var(--ease) infinite}
  .live .a-buzz{animation:buzz .12s linear infinite}
  .live .a-puff circle{animation:puff 1.6s ease-out infinite}
  .live .a-puff circle:nth-child(2){animation-delay:.5s}.live .a-puff circle:nth-child(3){animation-delay:1s}
  .live .a-sway{animation:sway 3s ease-in-out infinite}
  .live .a-air path{stroke-dasharray:6 8;animation:air .6s linear infinite}
  .live .a-leaf{animation:leaf 2.4s ease-in infinite}
  .live .a-leaf2{animation:leaf 2.4s ease-in 1.2s infinite}
  .live .a-blink{animation:blink 1.2s steps(2) infinite}
  .live .a-charge rect{animation:charge 1.8s ease-in-out infinite}
  .live .a-charge rect:nth-child(2){animation-delay:.3s}.live .a-charge rect:nth-child(3){animation-delay:.6s}
  .live .a-rock{animation:rock 3s ease-in-out infinite}
  .live .a-bob{animation:bob 2.4s ease-in-out infinite}
  .live .a-bob2{animation:bob 2.4s ease-in-out .6s infinite}
  .live .a-tick{animation:tick 2s steps(1) infinite}
  .live .a-snip{animation:snip 2.2s ease-in-out infinite}
  .live .a-snip2{animation:snip2 2.2s ease-in-out infinite}
  .live .a-slide{animation:slide 2.6s ease-in-out infinite}
  .live .a-tap{animation:tap 1.3s cubic-bezier(.5,0,.6,1) infinite}
  .live .a-bubble{animation:bubble 4s ease-in-out infinite}
  .live .a-glint{animation:glint 3s ease-in-out infinite}
  .live .a-drop{animation:drop 1.8s ease-in infinite}
  .live .a-float{animation:float 5s ease-in-out infinite}
}
@keyframes chop{0%,55%,100%{transform:rotate(0)}70%,80%{transform:rotate(9deg)}}
@keyframes buzz{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.4px)}50%{transform:translate(-.5px,.5px)}75%{transform:translate(.4px,.3px)}}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.8}100%{transform:translate(var(--dx,-14px),-18px) scale(1.4);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes air{to{stroke-dashoffset:28}}
@keyframes leaf{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-40px,-22px) rotate(-160deg);opacity:0}}
@keyframes blink{50%{opacity:.2}}
@keyframes charge{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rock{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tick{0%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(-28deg)}75%{transform:rotate(-14deg)}}
@keyframes snip{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes snip2{0%,100%{transform:rotate(0)}50%{transform:rotate(10deg)}}
@keyframes slide{0%,100%{transform:translateX(-10px)}50%{transform:translateX(2px)}}
@keyframes tap{0%,100%{transform:rotate(0)}40%{transform:rotate(-24deg)}55%{transform:rotate(4deg)}}
@keyframes bubble{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}

/* ---------- State + helpers ---------- */
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let data=null, loans=store.get('ts-loans',{}), careDone=store.get('ts-care',{}), view='';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?null:'$'+(Math.round(n*100)%100?n.toLocaleString('en-NZ',{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(n).toLocaleString('en-NZ'));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const niceDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'});
const label=t=>[t.brand,t.name].filter(Boolean).join(' ');
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const tools=()=>data.tools;
const byId=id=>tools().find(t=>t.id===id);
const cats=()=>data.categories||[];
const inCat=c=>tools().filter(t=>t.category===c);
const featured=()=>{const f=tools().filter(t=>t.featured).sort((a,b)=>a.featured-b.featured);return f.length?f:tools().slice(0,8)};
const loanOf=t=>loans[t.id]||(t.lentTo?{to:t.lentTo,on:t.lentOn||null,repo:true}:null);
const deep=c=>`color-mix(in srgb, ${c} 62%, #0b0d0e)`;
const words=txt=>txt.split(' ').map((w,k)=>`<span class="w"><span style="--k:${k}">${esc(w)}</span></span>`).join(' ');
const fit=(w,max,share=.94)=>`min(${max}px,${(share*100/(Math.max(3,w.length)*.5)).toFixed(1)}vw)`;
function careList(){
  const out=[];
  for(const t of tools()) for(const c of (t.care||[])){
    const key=t.id+':'+c.id, last=careDone[key]||null;
    const from=last||(c.now?null:data.careStart||null); // never ticked: counts from careStart unless flagged as needed now
    const left=from?c.every-days(from,today()):0;
    out.push({t,c,key,last,left,due:left<=0});
  }
  return out.sort((a,b)=>a.left-b.left);
}
const go=t=>{ location.hash=t.category+'/'+t.id; };

/* ---------- Shed (home) ---------- */
function viewShed(){
  const ts=tools(), paid=ts.reduce((s,t)=>s+(t.paid||0),0), home=ts.filter(t=>!loanOf(t)).length;
  const due=careList().filter(x=>x.due), out=ts.filter(loanOf), feat=featured();
  const priced=ts.filter(t=>t.newPrice&&t.paid!=null&&!t.demo), newSum=priced.reduce((s,t)=>s+t.newPrice,0), paidP=priced.reduce((s,t)=>s+t.paid,0);
  const save=newSum?1-paidP/newSum:0;
  const platforms={}; ts.forEach(t=>{if(t.power&&!/corded/i.test(t.power))(platforms[t.power]=platforms[t.power]||[]).push(t)});
  const demoN=ts.filter(t=>t.demo).length;
  const needs=[
    ...out.map(t=>{const l=loanOf(t);return `<button class="need screws rv" data-go="${t.id}"><span class="nt"><span class="lvl">Out</span><span class="mini">${svg(t)}</span></span><h3>${esc(t.tag||t.name)} is with ${esc(l.to)}</h3><p>${l.on?'Since '+niceDate(l.on)+' · '+days(l.on,today())+' days':'On loan'}</p></button>`}),
    ...due.map(x=>`<button class="need screws rv" data-go="${x.t.id}"><span class="nt"><span class="lvl care">Care due</span><span class="mini">${svg(x.t)}</span></span><h3>${esc(x.t.tag||x.t.name)}</h3><p>${esc(x.c.text)}</p></button>`)
  ];
  if(!needs.length) needs.push(`<div class="need screws rv"><span class="nt"><span class="lvl calm">All good</span></span><h3>Nothing needs you</h3><p>Every tool is home and looked after.</p></div>`);
  const motes=Array.from({length:14},(_,i)=>`<i style="left:${30+(i*37)%70}%;top:${50+(i*23)%45}%;animation-delay:${(i*0.7)%9}s"></i>`).join('');
  const slots=ts.map((t,i)=>{const l=loanOf(t);return `<button class="slot ${t.size||'small'} ${l?'ghost':''}" style="--i:${i}" data-go="${t.id}" aria-label="${esc(label(t))}${l?', lent to '+esc(l.to):''}"><span class="art">${svg(t)}</span>${l?`<span class="out">With ${esc(l.to)}</span>`:''}<span class="dymo">${esc(t.tag||t.name)}</span></button>`}).join('');
  const panels=feat.map((t,i)=>{const l=loanOf(t), cat=cats().find(c=>c.id===t.category), w=t.verb||t.tag||'';
    return `<div class="panel" data-i="${i}" style="--c:${deep(t.colour)};z-index:${i+1}">${i?'<div class="teeth"></div>':''}
      <div class="rhead"><div class="rnum">${pad(i+1)}<small> / ${pad(feat.length)}</small></div><div class="rcat">${esc(cat?cat.name:'')}</div></div>
      <div class="rword" style="font-size:${fit(w,270)}">${esc(w)}</div>
      <div class="rart"><div class="a-float">${svg(t)}</div></div>
      <div class="rinfo"><span class="dymo lg">${esc(t.tag||t.name)}</span><span class="rname">${esc(label(t))}</span><span class="rrow">${t.paid!=null?`<span class="rpill">Paid ${money(t.paid)}</span>`:''}${t.newPrice?`<span class="rpill">New ${money(t.newPrice)}</span>`:''}${l?`<span class="rpill" style="background:var(--warn)">With ${esc(l.to)}</span>`:''}<button class="rbtn" data-go="${t.id}">Open ${arrow}</button></span></div>
    </div>`}).join('');
  const tapeTxt='Measure twice · Cut once · Put it back where it hangs · ';
  return `<section class="hero" id="hero"><div class="hstage"><div class="stipple"></div><div class="hglow"></div>
      <div class="blade" id="blade"><svg viewBox="0 0 200 200" aria-hidden="true">${bladeSvg()}</svg></div><div class="motes">${motes}</div>
      <div class="hcopy" id="hcopy"><span class="kicker" style="color:rgba(239,230,212,.7)">${esc(data.shed?.place||'')}</span>
      <h1 class="tt">${words('The')}<br><span class="acc">${words('Shed')}</span></h1>
      <p class="hsub sub">Every tool, where it hangs, and what it's good for.</p>
      <div class="hstats sub"><span class="pill"><b data-count="${ts.length}">0</b> tools</span><span class="pill"><b data-count="${home}">0</b> home</span><span class="pill"><b>${due.length}</b> ${due.length===1?'job':'jobs'} due</span></div></div>
      <div class="hscroll"><i></i>Scroll</div><div class="mist"></div></div></section>
  <div class="flow">
    <div class="sechead"><h2>On the <span class="serif">bench</span></h2><span class="kicker">${needs.length>1?needs.length+' things':''}</span></div>

    <div class="tapewrap rv" role="group" aria-label="Shed totals"><div class="tcase"><i></i></div><div class="tape"><div><b>${ts.length}</b><span>Tools</span></div><div><b>${home}</b><span>At home</span></div><div><b>${money(Math.round(paid))}</b><span>Paid</span></div></div></div>
    <div class="sechead"><h2>The <span class="serif">wall</span></h2><span class="kicker">Tap a tool</span></div>

    <div class="sechead"><h2>The <span class="serif">favourites</span></h2><span class="kicker">Keep scrolling</span></div>
  </div>
  <section class="reel" id="reel" style="height:calc(${feat.length} * 70svh + 100svh)"><div class="rstage" id="rstage">${panels}<div class="ruler" aria-hidden="true"><b id="rmark"></b></div></div></section>
  <section class="lineup" id="lineup"><div class="lstage" id="lstage">
    <div class="lhead"><span class="kicker">${ts.length} tools</span><h2>The whole <span class="serif">kit</span></h2></div>
    <div><div class="ltrack" id="ltrack">${ts.map(t=>`<button class="lu" data-go="${t.id}" aria-label="${esc(label(t))}">${svg(t)}<span class="dymo">${esc(t.tag||t.name)}</span></button>`).join('')}</div><div class="shelf"></div>
    <div class="lfoot"><span>Tap one to open it</span><span id="lcount">01 / ${pad(ts.length)}</span></div></div>
  </div></section>
  <div class="flow">
    <div class="ctape" aria-hidden="true"><div><span>${tapeTxt.repeat(3)}</span><span>${tapeTxt.repeat(3)}</span></div></div>
    <section class="say" id="say"><p>${'Less buying.'.split(' ').map(w=>`<span class="wd">${w}</span>`).join(' ')} <span class="serif">${'More fixing.'.split(' ').map((w,k)=>`<span class="wd ${k?'hv':''}">${w}</span>`).join(' ')}</span></p><p class="sub2">A good used tool does the job for half the price. Look after it and it lasts.</p></section>
    ${priced.length?`<div class="gauge rv" style="--off:${(251.4*(1-save)).toFixed(1)};--deg:${(-90+180*save).toFixed(1)}deg"><span class="kicker" style="color:rgba(239,230,212,.7)">Bargain meter</span>
      <svg viewBox="0 0 200 112" aria-hidden="true"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="rgba(239,230,212,.14)" stroke-width="14" stroke-linecap="round"/><path class="garc" d="M20 100A80 80 0 0 1 180 100"/>${Array.from({length:11},(_,i)=>{const a=Math.PI*(1-i/10),x1=100+62*Math.cos(a),y1=100-62*Math.sin(a),x2=100+56*Math.cos(a),y2=100-56*Math.sin(a);return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="rgba(239,230,212,.5)" stroke-width="1.5"/>`}).join('')}<g class="gneedle"><path d="M100 100L100 40" stroke="#EFE6D4" stroke-width="3" stroke-linecap="round"/></g><circle cx="100" cy="100" r="7" fill="#EFE6D4"/></svg>
      <p class="gbig">${Math.round(save*100)}<small>%</small></p><p class="gline">under the new price</p><p class="gnote">${money(paidP)} paid for ${priced.length} tools that cost ${money(newSum)} new.</p></div>`:''}
    ${Object.entries(platforms).map(([p,list])=>`<div class="card cardpad platform rv"><span class="swatch" style="background:${list[0].colour}"></span><div><span class="kicker">Battery platform</span><h2>${esc(p)}</h2><p style="margin:6px 0 0;color:var(--body)">${list.map(t=>esc(t.tag||t.name)).join(' · ')}</p></div></div>`).join('')}
    <p class="foot">Updated ${niceDate(data.updated)}${demoN?` · ${demoN} sample tools included for now`:''}</p>

}

/* ---------- Category: artwork hero, then swipe through tool pages ---------- */
function toolPage(t,i,n){
  const l=loanOf(t), care=careList().filter(x=>x.t===t);
  const save=t.paid!=null&&t.newPrice?Math.round(100-t.paid/t.newPrice*100):null;
  const pairs=(t.pairs||[]).map(byId).filter(Boolean), w=t.verb||'';
  const bp=[...(t.model?[['Model',t.model]]:[]),['Power',t.power||'Hand tool'],...(t.specs||[])];
  let k=0;
  return `<article class="page" data-id="${t.id}">
    <div class="plate live" style="background-color:${t.colour}">
      <span class="status ${l?'lent':''}">${l?'With '+esc(l.to):t.demo?'Sample tool':'In the shed'}</span>
      <span class="verb" aria-hidden="true" style="font-size:${fit(w,210,.84)}">${esc(w)}</span>
      <div class="big"><div class="a-float">${svg(t)}</div></div>
      <span class="dymo lg">${esc(t.name)}</span>
      <span class="who">${esc([t.brand,t.model].filter(Boolean).join(' · '))}</span>
    </div>
    <div class="facts">
      <div class="fact tag" style="--n:${k++}"><span class="k">Paid</span><span class="v num">${money(t.paid)||'–'}</span>${t.paid==null?'<span class="s">Not recorded</span>':''}</div>
      <div class="fact tag" style="--n:${k++}"><span class="k">New price</span><span class="v num">${money(t.newPrice)||'–'}</span><span class="s">${t.newFrom?esc(t.newFrom):'Not looked up yet'}</span></div>
      ${save!=null?`<div class="fact wide hvf" style="--n:${k++}"><span class="k">Bargain</span><span class="v" style="font-weight:700">${save}% under the new price</span></div>`:''}
      <div class="fact" style="--n:${k++}"><span class="k">Power</span><span class="v">${esc(t.power||'Hand tool')}</span></div>
      <div class="fact" style="--n:${k++}"><span class="k">Condition</span><span class="v">${esc({good:'Good',fair:'Fair',worn:'Worn'}[t.condition]||'Working')}</span></div>
      ${t.spot?`<div class="fact wide" style="--n:${k++}"><span class="k">Lives</span><span class="v">${esc(t.spot)}</span></div>`:''}
    </div>
    ${t.notes?`<div class="note">${esc(t.notes)}</div>`:''}
    ${(t.uses||[]).length?`<div class="card cardpad"><h2>Good for</h2><ul class="uses">${t.uses.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${(t.includes||[]).length?`<div class="card cardpad"><h2>In the kit</h2><ul class="kit">${t.includes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <div class="bp"><h2>Blueprint</h2><div class="bpart">${svg(t)}</div><div class="dim">${esc(t.tag||t.name)}</div><dl>${bp.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>
    ${care.length?`<div class="card"><div class="cardpad" style="padding-bottom:0"><h2>Care</h2></div>${care.map(x=>`<label class="task ${x.last&&!x.due?'done':''}"><input type="checkbox" data-care="${x.key}" ${x.last&&!x.due?'checked':''}><span class="tt2"><span class="tx">${esc(x.c.text)}</span><span class="when ${x.due?'due':''}">${x.due?'Due now':'Due in '+x.left+' day'+(x.left>1?'s':'')} · every ${x.c.every} days</span></span></label>`).join('')}</div>`:''}
    ${pairs.length?`<div class="card cardpad"><h2>Pairs with</h2><div class="pairs">${pairs.map(p=>`<button class="pair" data-go="${p.id}"><span class="mini">${svg(p)}</span>${esc(label(p))}</button>`).join('')}</div></div>`:''}
    <div class="card cardpad"><h2>${l?'On loan':'Lend it'}</h2>
      ${l?`<p style="margin:8px 0 0;color:var(--body)">With <b>${esc(l.to)}</b>${l.on?' since '+niceDate(l.on):''}.</p>${l.repo?'':`<div class="lendform"><button class="btn hvb" data-back="${t.id}" style="flex:1">It's back in the shed</button></div>`}`
        :`<form class="lendform" data-lend="${t.id}"><input name="who" placeholder="Who's borrowing it?" aria-label="Who's borrowing it?" autocomplete="off" required><button class="btn">Lend</button></form>`}
    </div>
    <p class="swipehint">${n>1?(i<n-1?'Swipe for the next tool →':'← Swipe back'):''}</p>
  </article>`;
}
const chero=(key,kicker,titleHtml,sub)=>`<section class="chero live"><div class="stipple"></div><div class="cglow"></div><div class="emb">${(EMB[key]||EMB.hand)()}</div><span class="kicker">${kicker}</span><h1 class="tt ${titleHtml.includes('<br>')?'long':''}">${titleHtml}</h1><span class="swash"></span><p class="sub">${esc(sub)}</p></section>`;
function viewCat(c){
  const list=inCat(c.id);
  return `<div class="flow">${chero(c.id,list.length+' tools',`<span class="acc">${words(c.name)}</span>`,c.blurb||'')}
    <div class="picker" id="picker">${list.map((t,i)=>`<button class="pk" data-idx="${i}" aria-current="${i===0}">${svg(t)}${esc(t.tag||t.name)}</button>`).join('')}</div>
    <div class="posrow"><span class="pos" id="pos">01 / ${pad(list.length)}</span><span class="dots" id="dots">${list.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</span></div>
    <div class="rail" id="rail">${list.map((t,i)=>toolPage(t,i,list.length)).join('')}</div></div>`;
}

/* ---------- Care + Lent ---------- */
function viewCare(){
  const list=careList(), due=list.filter(x=>x.due), later=list.filter(x=>!x.due);
  const task=x=>`<label class="task ${x.last&&!x.due?'done':''}"><input type="checkbox" data-care="${x.key}" ${x.last&&!x.due?'checked':''}><span class="tt2"><span class="tk">${esc(label(x.t))}</span><span class="tx">${esc(x.c.text)}</span><span class="when ${x.due?'due':''}">${x.due?(x.last?'Due now · last done '+niceDate(x.last):'Due now'):(x.last?'Done '+niceDate(x.last)+' · ':'')+'due in '+x.left+' day'+(x.left>1?'s':'')}</span></span></label>`;
  return `<div class="flow">${chero('care',list.length+' jobs',`${words('Keep it')}<br><span class="acc">${words('sharp')}</span>`,"Small jobs that keep the tools working. Turn the nut when it's done.")}
  <section class="rv"><h2 class="h2s">Due now · ${due.length}</h2>${due.length?`<div class="card">${due.map(task).join('')}</div>`:'<p class="empty card">Nothing due. Nice work.</p>'}</section>
  ${later.length?`<section class="rv"><h2 class="h2s">Coming up</h2><div class="card">${later.map(task).join('')}</div></section>`:''}
  <p class="foot">Ticks are saved on this phone.</p></div>`;
}
function row(t){const l=loanOf(t);return `<li><button class="item" data-go="${t.id}"><span class="thumb" style="background:color-mix(in srgb,${t.colour} 16%,transparent)">${svg(t)}</span><span class="txt"><b>${esc(label(t))}</b><span>${l?'With '+esc(l.to):esc([t.model,t.power].filter(Boolean).join(' · ')||'In the shed')}</span></span><span class="val">${money(t.paid)||''}</span></button></li>`}
function viewLent(){
  const out=tools().filter(loanOf), home=tools().filter(t=>!loanOf(t));
  return `<div class="flow">${chero('lent',out.length+' out',`${words("Who's got")}<br><span class="acc">${words('it?')}</span>`,"Lend a tool and it shows as an empty outline on the wall until it's back.")}
  <section class="rv"><h2 class="h2s">Out now · ${out.length}</h2>${out.length?`<div class="card">${out.map(t=>{const l=loanOf(t);return `<div class="loan"><span class="mini">${svg(t)}</span><div style="flex:1;min-width:0"><b>${esc(label(t))}</b><div style="font-size:14px;color:var(--muted)">With ${esc(l.to)}${l.on?' since '+niceDate(l.on)+' ('+days(l.on,today())+' days)':''}</div></div>${l.repo?'':`<button class="btn hvb" data-back="${t.id}">Back</button>`}</div>`}).join('')}</div>`:'<p class="empty card">Everything is home.</p>'}</section>
  <section class="rv"><h2 class="h2s">Lend something</h2><ul class="items card">${home.map(row).join('')}</ul></section>
  <p class="foot">Loans are saved on this phone.</p></div>`;
}

/* ---------- Tabs, router ---------- */
function tabs(cur){
  const due=careList().filter(x=>x.due).length, out=tools().filter(loanOf).length;
  const T=[['shed','Shed'],...cats().map(c=>[c.id,c.name]),['care','Care',due],['lent','Lent',out]];
  $('#tabs').innerHTML=T.map(([id,name,n])=>`<a class="tab" href="#${id}" ${cur===id?'aria-current="page"':''}>${ICON[id]||ICON.hand}${esc(name)}${n?`<span class="dot">${n}</span>`:''}</a>`).join('');
}
function parse(){ const [v,id]=location.hash.slice(1).split('/'); return {v:v||'shed',id}; }
function render(keep){
  if(!data) return;
  let {v,id}=parse();
  const cat=cats().find(c=>c.id===v);
  if(!cat&&!['shed','care','lent'].includes(v)) v='shed';
  const same=v===view&&keep;
  if(cat&&v===view&&$('#rail')&&!keep){ scrollRailTo(id,true); return; } // same category: just move to the tool
  view=v;
  const y=window.scrollY, railX=$('#rail')?.scrollLeft;
  $('#main').innerHTML=v==='shed'?viewShed():v==='care'?viewCare():v==='lent'?viewLent():viewCat(cat);
  document.body.classList.toggle('dark-top',v==='shed');
  tabs(v);
  if(same){ window.scrollTo(0,y); if($('#rail')&&railX!=null) $('#rail').scrollLeft=railX; }
  else window.scrollTo(0,0);
  wire(cat,same?null:id,same);
}
function scrollRailTo(id,smooth){
  const rail=$('#rail'); if(!rail) return;
  const list=inCat(view), i=Math.max(0,list.findIndex(t=>t.id===id));
  rail.scrollTo({left:i*rail.clientWidth,behavior:smooth?'smooth':'auto'});
  railState(i);
  if(smooth){ const p=$('#picker'); window.scrollTo({top:Math.max(0,p.getBoundingClientRect().top+window.scrollY-80),behavior:'smooth'}); }
}
function railState(i){
  const list=inCat(view); if(!list[i]) return;
  $('#pos').textContent=`${pad(i+1)} / ${pad(list.length)}`;
  $$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
  $$('#picker .pk').forEach((p,k)=>p.setAttribute('aria-current',k===i));
  const pk=$$('#picker .pk')[i]; if(pk){ const pr=$('#picker'); pr.scrollTo({left:pk.offsetLeft-pr.clientWidth/2+pk.clientWidth/2,behavior:'smooth'}); }
  $$('#rail .page').forEach((p,k)=>p.classList.toggle('cur',k===i));
  const page=$$('#rail .page')[i]; if(page) $('#rail').style.height=page.scrollHeight+'px'; // rail is as tall as the page on screen
}
let rio;
function sizeLineup(){ const lt=$('#ltrack'), lu=$('#lineup'); if(lt&&lu) lu.style.height=(innerHeight+Math.max(0,lt.scrollWidth-$('#lstage').clientWidth))+'px'; } // scroll distance = how far the shelf slides
function wire(cat,id,same){
  rio&&rio.disconnect();
  rio='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'}):null;
  $$('.rv, #board').forEach(el=>rio?rio.observe(el):el.classList.add('in'));
  if(view==='shed'){ sizeLineup(); countUp(); }
  if(cat){
    const rail=$('#rail'); let tmr;
    rail.addEventListener('scroll',()=>{clearTimeout(tmr);tmr=setTimeout(()=>{const i=Math.round(rail.scrollLeft/rail.clientWidth),t=inCat(view)[i];if(!t)return;railState(i);history.replaceState(null,'','#'+view+'/'+t.id)},80)},{passive:true});
    if(same) railState(Math.round(rail.scrollLeft/rail.clientWidth));
    else requestAnimationFrame(()=>scrollRailTo(id,false));
  }
  onScroll();
}
function countUp(){
  $$('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),dur=1100;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;return}
    const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(step)};
    setTimeout(()=>requestAnimationFrame(step),500);});
}

/* ---------- Scroll engine ---------- */
function onScroll(){
  const sy=window.scrollY, max=document.documentElement.scrollHeight-innerHeight, vial=$('.vial');
  $('#bubble').style.transform=`translateX(${((max>0?clamp(sy/max):0)-.5)*(vial.clientWidth-16)}px)`;
  $('#top').classList.toggle('glassy',view!=='shed'?sy>8:sy>innerHeight*.9);
  if(view!=='shed') return;
  const h=$('#hero'), hc=$('#hcopy');
  if(h&&hc){ const p=clamp(sy/(h.offsetHeight-innerHeight)); hc.style.transform=`translateY(${-60*p}px) scale(${1-.14*p})`; hc.style.opacity=clamp(1.25-p*1.5); $('#blade').style.transform=`rotate(${sy*.22}deg) scale(${1+p*.25})`; }
  const reel=$('#reel');
  if(reel){
    const r=reel.getBoundingClientRect(), total=r.height-innerHeight, p=clamp(-r.top/total), ps=$$('#reel .panel'), n=ps.length;
    const x=p*n, cur=Math.min(n-1,Math.floor(x)), near=r.top<innerHeight&&r.bottom>0;
    ps.forEach((el,i)=>{
      const t=i===0?1:clamp((x-(i-.42))/.42);   // 0 = below the screen, 1 = fully up. Panel i finishes rising as step i begins.
      el.style.transform=`translate3d(0,${((1-t)*100).toFixed(2)}%,0)`;
      const show=i===cur||i===cur+1;            // everything earlier is covered, everything later is still below
      el.style.visibility=show?'visible':'hidden';
      el.classList.toggle('live',near&&show&&t>0);
      if(show){
        const f=clamp((x-i+.42)/1.42), art=el.querySelector('.rart'), word=el.querySelector('.rword');
        art.style.transform=`translateY(calc(-50% + ${(f-.5)*-46}px)) rotate(${(f-.5)*-18}deg) scale(${.86+.14*Math.sin(Math.PI*f)})`;
        word.style.transform=`translateY(-50%) translateX(${(.5-f)*8}%)`;
      }
    });
    const rm=$('#rmark'); rm.style.transform=`translateY(${p*rm.parentNode.clientHeight}px)`;
  }
  const lu=$('#lineup');
  if(lu){ const r=lu.getBoundingClientRect(), total=r.height-innerHeight, p=total>0?clamp(-r.top/total):0, lt=$('#ltrack'), dist=Math.max(0,lt.scrollWidth-$('#lstage').clientWidth);
    lt.style.transform=`translate3d(${-p*dist}px,0,0)`; const n=tools().length; $('#lcount').textContent=`${pad(Math.min(n,1+Math.round(p*(n-1))))} / ${pad(n)}`; }
  const say=$('#say');
  if(say){ const r=say.getBoundingClientRect(), p=clamp((innerHeight*.85-r.top)/(r.height*.8)), ws=$$('#say .wd'); ws.forEach((w,k)=>w.classList.toggle('lit',p>(k+.5)/ws.length)); }
}
let ticking=false;
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;onScroll()})}},{passive:true});
addEventListener('resize',()=>{ if(!data) return; if(view==='shed') sizeLineup(); onScroll(); const rail=$('#rail'); if(rail) railState(Math.round(rail.scrollLeft/rail.clientWidth)); });

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); closeSheet(); go(byId(g.dataset.go)); return; }
  const pk=e.target.closest('[data-idx]'); if(pk){ const rail=$('#rail'); rail.scrollTo({left:+pk.dataset.idx*rail.clientWidth,behavior:'smooth'}); return; }
  const b=e.target.closest('[data-back]'); if(b){ delete loans[b.dataset.back]; store.set('ts-loans',loans); render(true); }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.care; if(!k) return;
  if(e.target.checked) careDone[k]=today(); else delete careDone[k];
  store.set('ts-care',careDone); setTimeout(()=>render(true),650);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-lend]'); if(!f) return; e.preventDefault();
  const who=f.who.value.trim(); if(!who) return;
  loans[f.dataset.lend]={to:who,on:today()}; store.set('ts-loans',loans); render(true);
});
addEventListener('hashchange',()=>render(false));

/* Search */
function openSheet(){ const s=$('#sheet'); s.hidden=false; s.classList.remove('open'); void s.offsetWidth; s.classList.add('open'); results(); setTimeout(()=>$('#q').focus(),50); }
function closeSheet(){ $('#sheet').hidden=true; }
function results(){
  const q=$('#q').value.trim().toLowerCase();
  const list=tools().filter(t=>!q||[t.name,t.brand,t.model,t.tag,t.verb,t.notes,...(t.includes||[]),...(t.uses||[])].join(' ').toLowerCase().includes(q));
  $('#results').innerHTML=list.length?`<ul class="items card">${list.map(row).join('')}</ul>`:'<p class="empty">Nothing matches. Try another word.</p>';
}
$('#searchBtn').addEventListener('click',()=>{ if(data) openSheet(); });
$('#sheetClose').addEventListener('click',closeSheet);
$('#q').addEventListener('input',results);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

/* Theme */
const THEMES=['auto','light','dark'];
const TI={auto:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',light:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',dark:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'};
function applyTheme(t){ if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); $('#themeBtn').innerHTML=TI[t]; $('#themeBtn').setAttribute('aria-label','Theme: '+t+'. Tap to change'); }
let theme=store.get('ts-theme','auto'); applyTheme(theme);
$('#themeBtn').addEventListener('click',()=>{ theme=THEMES[(THEMES.indexOf(theme)+1)%3]; store.set('ts-theme',theme); applyTheme(theme); });

/* Load */
fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{ data=d; render(false); })
  .catch(()=>{ $('#main').innerHTML='<p class="empty">Couldn\'t open the shed. Check your connection and refresh.</p>'; });
</script>
</body>
